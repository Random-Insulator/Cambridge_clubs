<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Portal — CambridgeClubs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      background: #f6bb69;
    }

    body {
      min-height: 100vh;
      background: #f6bb69;
      font-family: 'DM Sans', sans-serif;
      color: #1a1a1a;
      position: relative;
      overflow-x: hidden;
    }

    /* Watermark logo background aligned with main website */
    body::before {
      content: "";
      position: fixed;
      top: 50%;
      left: 50%;
      width: 45vw;
      height: 45vw;
      max-width: 550px;
      max-height: 550px;
      background-image: url('../images/favicon.jpg');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      opacity: 0.12;
      pointer-events: none;
      z-index: -1;
      mix-blend-mode: multiply;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.45) 0%, transparent 100%);
      pointer-events: none;
      z-index: -2;
    }

    /* ── Login Screen ─────────────────── */
    #loginScreen {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 32px 20px;
    }
    .login-card-wrapper {
      position: relative; z-index: 1; width: 100%; max-width: 440px;
    }
    .login-card {
      background: rgba(255, 253, 249, 0.82);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.75);
      border-radius: 28px; padding: 44px 40px;
      box-shadow: 
        0 20px 50px rgba(90, 57, 12, 0.12),
        0 1px 3px rgba(0, 0, 0, 0.05),
        inset 0 1px 0 rgba(255, 255, 255, 0.9);
      animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .logo-container {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px;
    }
    .brand-logo {
      display: flex; align-items: center; gap: 10px;
    }
    .brand-logo img {
      width: 34px; height: 34px; border-radius: 50%; object-fit: cover; box-shadow: 0 3px 10px rgba(0,0,0,0.12);
    }
    .brand-text {
      font-family: 'Syne', sans-serif; font-size: 1.15rem; font-weight: 800; letter-spacing: -0.3px; color: #000; line-height: 1;
    }
    .brand-text span { color: #e02020; }
    .admin-badge {
      display: inline-block; background: rgba(224, 32, 32, 0.12);
      color: #dc2626; border: 1px solid rgba(224, 32, 32, 0.25);
      border-radius: 20px; padding: 4px 12px; font-size: 0.75rem;
      font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em;
    }
    h1 { font-family: 'Syne', sans-serif; font-size: 1.85rem; font-weight: 800; letter-spacing: -0.6px; color: #2D1D05; margin-bottom: 8px; }
    .subtitle { color: #7a5426; font-size: 0.92rem; margin-bottom: 32px; line-height: 1.5; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-size: 0.75rem; font-weight: 800; color: #6B4219; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; }
    .input-field {
      width: 100%; padding: 14px 16px;
      background: rgba(255, 255, 255, 0.9); border: 1.5px solid rgba(138, 92, 36, 0.18);
      border-radius: 14px; color: #2D1D05;
      font-family: 'DM Sans', sans-serif; font-size: 0.95rem; font-weight: 500; outline: none;
      transition: all 0.2s ease; box-shadow: inset 0 1px 2px rgba(0,0,0,0.02);
    }
    .input-field:focus { border-color: #d97706; background: #ffffff; box-shadow: 0 0 0 4px rgba(217, 119, 6, 0.15); }
    .submit-btn {
      width: 100%; padding: 15px;
      background: linear-gradient(135deg, #3a2204, #1a0f02);
      border: none; border-radius: 14px;
      color: #FFFDFB; font-family: 'DM Sans', sans-serif; font-size: 1rem; font-weight: 700;
      cursor: pointer; position: relative; overflow: hidden;
      transition: all 0.25s ease; box-shadow: 0 6px 20px rgba(45, 29, 5, 0.25); margin-top: 8px;
    }
    .submit-btn::before {
      content: ""; position: absolute; top: 0; left: -100%; width: 60%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
      animation: shine 3.5s infinite;
    }
    @keyframes shine { 0% { left: -100%; } 30%, 100% { left: 120%; } }
    .submit-btn:hover { background: linear-gradient(135deg, #4d2d05, #261603); transform: translateY(-2px); box-shadow: 0 10px 28px rgba(45, 29, 5, 0.35); }
    .submit-btn:active { transform: translateY(0); }
    .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }
    .error-msg { display: none; color: #b91c1c; font-size: 0.88rem; font-weight: 600; margin-top: 16px;
      padding: 12px 16px; background: rgba(254, 226, 226, 0.9); border: 1px solid #fca5a5; border-radius: 12px; line-height: 1.4; }
    .error-msg.show { display: block; }

    /* ── Dashboard ────────────────────── */
    #dashboard { display: none; }

    header {
      position: sticky; top: 0; z-index: 100;
      background: #c17d1771; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
      padding: 0 32px; height: 60px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .logout-btn {
      background: rgba(255, 255, 255, 0.8); border: 1px solid rgba(90, 57, 12, 0.2); border-radius: 20px;
      padding: 6px 16px; color: #5A390C; font-family: 'DM Sans', sans-serif; font-size: 0.82rem; font-weight: 600;
      cursor: pointer; transition: all 0.2s ease;
    }
    .logout-btn:hover { background: #dc2626; color: #fff; border-color: #dc2626; }

    main { max-width: 950px; margin: 0 auto; padding: 36px 24px; }

    .page-header { margin-bottom: 28px; }
    .page-header h2 { font-family: 'Syne', sans-serif; font-size: 1.5rem; font-weight: 800; color: #2D1D05; margin-bottom: 4px; }
    .page-header p { color: #6B4219; font-size: 0.92rem; font-weight: 500; }

    /* Tabs */
    .tabs { display: flex; gap: 6px; background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(90, 57, 12, 0.15);
      border-radius: 14px; padding: 5px; margin-bottom: 24px; width: fit-content; }
    .tab-btn {
      padding: 9px 20px; border: none; border-radius: 10px; cursor: pointer;
      font-family: 'DM Sans', sans-serif; font-size: 0.88rem; font-weight: 700; color: #6B4219;
      background: none; transition: all 0.2s ease;
    }
    .tab-btn.active { background: #5A390C; color: #FFFDFB; box-shadow: 0 4px 12px rgba(90, 57, 12, 0.25); }

    /* Cards */
    .pending-card {
      display: flex; gap: 16px; align-items: flex-start;
      background: rgba(255, 255, 255, 0.88); backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 18px; padding: 20px; margin-bottom: 16px;
      box-shadow: 0 6px 20px rgba(90, 57, 12, 0.08);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      animation: fadeIn 0.3s ease;
    }
    .pending-card:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(90, 57, 12, 0.14); }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .pending-card.approved { border-color: #86efac; background: rgba(255, 255, 255, 0.92); }
    .pending-card.rejected { opacity: 0.6; }

    .card-thumb {
      width: 96px; height: 96px; border-radius: 14px; object-fit: cover;
      background: #f8f3ed; border: 1px solid rgba(90, 57, 12, 0.15); flex-shrink: 0;
    }
    .card-thumb-ph {
      width: 96px; height: 96px; border-radius: 14px;
      background: #f8f3ed; border: 1px solid rgba(90, 57, 12, 0.15);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; color: #6B4219;
    }
    .card-body { flex: 1; min-width: 0; }
    .card-top { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; flex-wrap: wrap; }
    .card-title { font-family: 'Syne', sans-serif; font-size: 1.05rem; font-weight: 800; color: #2D1D05; }
    .card-club {
      background: rgba(90, 57, 12, 0.12); color: #5A390C;
      border-radius: 6px; padding: 2px 8px; font-size: 0.72rem; font-weight: 800;
      text-transform: uppercase;
    }
    .card-tag {
      background: rgba(255, 255, 255, 0.8); color: #6B4219; border: 1px solid rgba(90, 57, 12, 0.15);
      border-radius: 6px; padding: 2px 8px; font-size: 0.72rem; font-weight: 600;
    }
    .card-meta { font-size: 0.8rem; color: #6B4219; margin-bottom: 6px; }
    .card-desc { font-size: 0.85rem; color: #422A08; display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 12px; line-height: 1.4; }

    .card-actions { display: flex; gap: 10px; }
    .approve-btn, .reject-btn {
      padding: 8px 18px; border: none; border-radius: 10px;
      font-family: 'DM Sans', sans-serif; font-size: 0.85rem; font-weight: 700;
      cursor: pointer; transition: all 0.2s ease;
    }
    .approve-btn { background: #166534; color: #fff; box-shadow: 0 2px 8px rgba(22, 101, 52, 0.25); }
    .approve-btn:hover { background: #15803d; transform: translateY(-1px); }
    .reject-btn  { background: #dc2626; color: #fff; box-shadow: 0 2px 8px rgba(220, 38, 38, 0.25); }
    .reject-btn:hover { background: #b91c1c; transform: translateY(-1px); }
    .approve-btn:disabled, .reject-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }

    .status-pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 5px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 700;
    }
    .status-pill.approved { background: rgba(220, 252, 231, 0.9); color: #166534; border: 1px solid #86efac; }
    .status-pill.rejected { background: rgba(254, 226, 226, 0.9); color: #991b1b; border: 1px solid #fca5a5; }

    .empty-state { text-align: center; padding: 60px 24px; color: #6B4219; font-weight: 500; }
    .empty-state svg { width: 48px; height: 48px; margin: 0 auto 12px; display: block; opacity: 0.4; color: #5A390C; }
    .empty-state p  { font-size: 0.95rem; }

    .loading { text-align: center; padding: 48px; color: #6B4219; font-size: 0.9rem; font-weight: 500; }

    .count-badge {
      background: #e02020; color: #fff;
      border-radius: 20px; padding: 2px 8px; font-size: 0.72rem; font-weight: 800;
      margin-left: 6px;
    }
  </style>

  <link rel="icon" href="../images/favicon.jpg" type="image/jpeg">
</head>
<body>

  <!-- ── Login Screen ─────────────────────────────────── -->
  <div id="loginScreen">
    <div class="login-card-wrapper">
      <div class="login-card">
        <div class="logo-container">
          <div class="brand-logo">
            <img src="../images/favicon.jpg" alt="Logo">
            <div class="brand-text">CAMBRIDGE<span>CLUBS</span></div>
          </div>
          <span class="admin-badge">Admin</span>
        </div>
        <h1>Admin Login</h1>
        <p class="subtitle">Review and manage activity submissions across all school clubs.</p>
        <form id="loginForm">
          <div class="form-group">
            <label for="adminPassword">Admin Password</label>
            <input type="password" id="adminPassword" class="input-field" placeholder="Enter admin password" required autocomplete="current-password" />
          </div>
          <button type="submit" class="submit-btn" id="loginBtn">Sign in →</button>
          <div class="error-msg" id="loginError"></div>
        </form>
      </div>
    </div>
  </div>

  <!-- ── Dashboard ──────────────────────────────────────── -->
  <div id="dashboard">
    <header>
      <div class="header-left">
        <div class="logo" style="margin:0">
          <img src="../images/favicon.jpg" alt="Logo" style="width:28px; height:28px; border-radius:50%; object-fit:cover;">
          CAMBRIDGE<span>CLUBS</span> <span class="admin-badge">Admin</span>
        </div>
      </div>
      <button class="logout-btn" id="logoutBtn">Sign out</button>
    </header>

    <main>
      <div class="page-header">
        <h2>Approval Queue</h2>
        <p>Review uploads submitted by club mentors before they appear publicly.</p>
      </div>

      <div class="tabs">
        <button class="tab-btn active" id="tabPending" onclick="switchTab('pending')">
          Pending <span class="count-badge" id="pendingCount" style="display:none">0</span>
        </button>
        <button class="tab-btn" id="tabAll" onclick="switchTab('all')">All Uploads</button>
      </div>

      <div id="pendingList"><div class="loading">Loading…</div></div>
    </main>
  </div>

  <script>
    const API   = '';
    let token   = localStorage.getItem('cc_admin_token');
    let allActivities = [];
    let currentTab = 'pending';

    function init() {
      if (token) {
        showDashboard();
      }
    }

    function showDashboard() {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      loadAll();
    }

    // ── Login ─────────────────────────────────────────────
    document.getElementById('loginForm').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const err = document.getElementById('loginError');
      btn.disabled = true; btn.textContent = 'Signing in…';
      err.classList.remove('show');

      try {
        const res  = await fetch(`${API}/api/admin/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: document.getElementById('adminPassword').value })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Login failed');
        token = data.token;
        localStorage.setItem('cc_admin_token', token);
        showDashboard();
      } catch (ex) {
        err.textContent = ex.message;
        err.classList.add('show');
        btn.disabled = false; btn.textContent = 'Sign in →';
      }
    });

    // ── Logout ────────────────────────────────────────────
    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem('cc_admin_token');
      token = null;
      document.getElementById('dashboard').style.display = 'none';
      document.getElementById('loginScreen').style.display = 'flex';
    });

    // ── Tabs ──────────────────────────────────────────────
    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('tabPending').classList.toggle('active', tab === 'pending');
      document.getElementById('tabAll').classList.toggle('active', tab === 'all');
      renderList();
    }

    // ── Load all activities (admin sees all) ──────────────
    async function loadAll() {
      const list = document.getElementById('pendingList');
      try {
        // Load pending and build a full picture
        const [pendingRes] = await Promise.all([
          fetch(`${API}/api/admin/pending`, { headers: { 'Authorization': `Bearer ${token}` } })
        ]);

        if (pendingRes.status === 401 || pendingRes.status === 403) {
          localStorage.removeItem('cc_admin_token'); token = null;
          location.reload(); return;
        }

        const pending = await pendingRes.json();

        // Also fetch approved for each club to build full list
        const clubs = ['teded','cybersonic','robotics','cookery','quizzarders','finance','Theatre','eco','Technocrates','debate','literary'];
        const approvedAll = (await Promise.all(
          clubs.map(c => fetch(`${API}/api/activities/${c}`).then(r => r.json()))
        )).flat();

        const pendingMap = new Map(pending.map(a => [a.id, a]));
        const approvedMap = new Map(approvedAll.map(a => [a.id, a]));

        // Combine and map statuses accurately
        const combined = new Map();
        for (const a of approvedAll) {
          combined.set(a.id, { ...a, _status: a.deleteRequested ? 'delete_requested' : 'approved' });
        }
        for (const a of pending) {
          if (a.deleteRequested) {
            combined.set(a.id, { ...a, _status: 'delete_requested' });
          } else if (!a.approved) {
            combined.set(a.id, { ...a, _status: 'pending' });
          }
        }

        allActivities = Array.from(combined.values()).sort((a, b) => new Date(b.uploadedAt || 0) - new Date(a.uploadedAt || 0));

        const pendingCount = allActivities.filter(a => a._status === 'pending' || a.deleteRequested).length;
        const badge = document.getElementById('pendingCount');
        if (pendingCount > 0) { badge.textContent = pendingCount; badge.style.display = 'inline'; }
        else                    { badge.style.display = 'none'; }

        renderList();
      } catch {
        list.innerHTML = '<div class="loading">Could not load data. Is the server running?</div>';
      }
    }

    function renderList() {
      const list = document.getElementById('pendingList');
      const items = currentTab === 'pending'
        ? allActivities.filter(a => a._status === 'pending' || a.deleteRequested || a._status === 'delete_requested')
        : allActivities;

      if (!items.length) {
        list.innerHTML = `
          <div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>
            </svg>
            <p>${currentTab === 'pending' ? 'No pending requests — you\'re all caught up! ✓' : 'No uploads yet.'}</p>
          </div>`;
        return;
      }

      list.innerHTML = items.map(a => {
        const isDeleteRequested = a.deleteRequested || a._status === 'delete_requested';
        let actionsHtml = '';

        if (isDeleteRequested) {
          actionsHtml = `
            <div class="card-actions" style="margin-top:10px;">
              <button class="reject-btn" id="approve-del-${a.id}" onclick="doReject('${a.id}', true)" style="background:#dc2626; color:#fff; border:none; padding:8px 14px; font-weight:600; border-radius:6px; cursor:pointer;">✓ Approve Removal</button>
              <button class="approve-btn" id="cancel-del-${a.id}" onclick="doCancelDelete('${a.id}')" style="background:#e5e7eb; color:#374151; border:none; padding:8px 14px; font-weight:600; border-radius:6px; cursor:pointer;">✕ Keep Activity</button>
            </div>`;
        } else if (a._status === 'pending' || !a.approved) {
          actionsHtml = `
            <div class="card-actions">
              <button class="approve-btn" id="approve-${a.id}" onclick="doApprove('${a.id}')">✓ Approve</button>
              <button class="reject-btn"  id="reject-${a.id}"  onclick="doReject('${a.id}', false)">✕ Reject</button>
            </div>`;
        } else {
          actionsHtml = `
            <div class="card-actions" style="display:flex; justify-content:space-between; align-items:center; margin-top:8px;">
              <span class="status-pill approved">✓ Approved${a.approvedAt ? '  ' + new Date(a.approvedAt).toLocaleDateString() : ''}</span>
              <button class="reject-btn" id="reject-${a.id}" onclick="doReject('${a.id}', true)" style="background:#fee2e2; color:#dc2626; border:1px solid #fca5a5; padding:6px 12px; font-size:12px; font-weight:600;">🗑 Remove Activity</button>
            </div>`;
        }

        return `
          <div class="pending-card ${a._status}" id="card-${a.id}">
            <img class="card-thumb" src="${API}${a.img}" alt="${a.title}"
                 onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
            <div class="card-thumb-ph" style="display:none">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            </div>
            <div class="card-body">
              <div class="card-top">
                <div class="card-title">${a.title}</div>
                <span class="card-club">${a.clubId}</span>
                <span class="card-tag" ${isDeleteRequested ? 'style="background:#fee2e2; color:#dc2626; font-weight:700;"' : ''}>${isDeleteRequested ? '⚠️ Removal Requested' : a.tag}</span>
              </div>
              <div class="card-meta">${a.date || ''}  ·  Uploaded ${new Date(a.uploadedAt || Date.now()).toLocaleString()}</div>
              <div class="card-desc">${a.desc || '<em style="opacity:.5">No description</em>'}</div>
              ${actionsHtml}
            </div>
          </div>`;
      }).join('');
    }

    // ── Approve ───────────────────────────────────────────
    async function doApprove(id) {
      const appBtn = document.getElementById(`approve-${id}`);
      const rejBtn = document.getElementById(`reject-${id}`);
      if (appBtn) appBtn.disabled = true;
      if (rejBtn) rejBtn.disabled = true;
      if (appBtn) appBtn.textContent = 'Approving…';
      try {
        const act = allActivities.find(a => a.id === id);
        const res = await fetch(`${API}/api/admin/approve/${id}`, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ activity: act })
        });
        if (!res.ok) throw new Error((await res.json()).error);
        if (act) { act._status = 'approved'; act.approvedAt = new Date().toISOString(); act.approved = true; }
        const pendingCount = allActivities.filter(a => (a._status === 'pending' || a.deleteRequested) && a._status !== 'approved').length;
        const badge = document.getElementById('pendingCount');
        if (pendingCount > 0) { badge.textContent = pendingCount; badge.style.display = 'inline'; }
        else                    { badge.style.display = 'none'; }
        renderList();
      } catch (ex) {
        alert('Approve failed: ' + ex.message);
        if (appBtn) appBtn.disabled = false;
        if (rejBtn) rejBtn.disabled = false;
        if (appBtn) appBtn.textContent = '✓ Approve';
      }
    }

    // ── Reject / Remove ────────────────────────────────────
    async function doReject(id, isApproved = false) {
      const msg = isApproved 
        ? 'Approve removal and permanently delete this activity from the website?' 
        : 'Reject and permanently delete this upload?';
      if (!confirm(msg)) return;
      const appBtn = document.getElementById(`approve-${id}`);
      const rejBtn = document.getElementById(`reject-${id}`);
      if (appBtn) appBtn.disabled = true;
      if (rejBtn) { rejBtn.disabled = true; rejBtn.textContent = 'Removing…'; }
      try {
        const res = await fetch(`${API}/api/admin/reject/${id}`, {
          method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` }
        });
        if (!res.ok) throw new Error((await res.json()).error);
        allActivities = allActivities.filter(a => a.id !== id);
        const pendingCount = allActivities.filter(a => (a._status === 'pending' || a.deleteRequested) && a._status !== 'approved').length;
        const badge = document.getElementById('pendingCount');
        if (pendingCount > 0) { badge.textContent = pendingCount; badge.style.display = 'inline'; }
        else                    { badge.style.display = 'none'; }
        renderList();
      } catch (ex) {
        alert('Action failed: ' + ex.message);
        if (appBtn) appBtn.disabled = false;
        if (rejBtn) { rejBtn.disabled = false; rejBtn.textContent = isApproved ? '✓ Approve Removal' : '✕ Reject'; }
      }
    }

    // ── Cancel Removal Request (Keep Activity Live) ─────────
    async function doCancelDelete(id) {
      if (!confirm('Reject teacher\'s removal request and keep this activity live on the site?')) return;
      const cancelBtn = document.getElementById(`cancel-del-${id}`);
      const appDelBtn = document.getElementById(`approve-del-${id}`);
      if (cancelBtn) cancelBtn.disabled = true;
      if (appDelBtn) appDelBtn.disabled = true;
      try {
        const res = await fetch(`${API}/api/admin/cancel-delete/${id}`, {
          method: 'POST', headers: { 'Authorization': `Bearer ${token}` }
        });
        if (!res.ok) throw new Error((await res.json()).error);
        const act = allActivities.find(a => a.id === id);
        if (act) {
          act.deleteRequested = false;
          act._status = 'approved';
        }
        const pendingCount = allActivities.filter(a => (a._status === 'pending' || a.deleteRequested) && a._status !== 'approved').length;
        const badge = document.getElementById('pendingCount');
        if (pendingCount > 0) { badge.textContent = pendingCount; badge.style.display = 'inline'; }
        else                    { badge.style.display = 'none'; }
        renderList();
      } catch (ex) {
        alert('Action failed: ' + ex.message);
        if (cancelBtn) cancelBtn.disabled = false;
        if (appDelBtn) appDelBtn.disabled = false;
      }
    }

    init();
  </script>
  <script src="../nav-previews.js"></script>
</body>
